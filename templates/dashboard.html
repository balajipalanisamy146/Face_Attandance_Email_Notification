<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Notification</title>

    <link rel="stylesheet" href="/static/style.css">

    <!--google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Neuton:ital,wght@0,200;0,300;0,400;0,700;0,800;1,400&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap"
        rel="stylesheet">

    <style>

        .soon{
            text-align: center;
            font-size: 60px;
            margin-top: 200px;
            color: rgb(208, 252, 255);
            text-shadow: 0 0 17px #00f2ff;
        }

        .cardt {
            background: rgba(255, 255, 255, 0.1);
            background: linear-gradient(45deg, #053f5e, #062c72, #044f45);
            backdrop-filter: blur(30px);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: 0.4s;
            border: none;
            margin-top: 150px;
            margin-left: 450px;
            margin-right: 450px;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .cardt h2 {
            margin-bottom: 15px;
        }

        .cardt button {
            margin-left: 190px;
            margin-right: 190px;
            margin-bottom: 10px;
            font-size: medium;
        }

        .cardt a {
            display: inline-block;
            white-space: nowrap;
            margin-left: 250px;
            margin-right: 380px;
            color: #00bfff;
            font-size: large;
            text-decoration: none;
        }

        .cardt:hover {
            transform: translatey(-10px) scale(1.03);
            box-shadow: 0 0 25px #11a0ff;
        }

        .cardt::before {
            content: "";
            position: absolute;
            border-radius: 22px;
            inset: 0;
            padding: 2.5px;
            background: linear-gradient(90deg, #38bdf8, #22c55e, #a855f7, #220bf5, #38bdf8);
            -webkit-mask: linear-gradient(#fff) content-box, linear-gradient(#fff);
            background-size: 300% 300%;
            mask-composite: exclude;
            opacity: 109;
            animation: moveglow 1s linear infinite;
            pointer-events: none;
        }

        @keyframes moveglow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 50% 100%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
    </style>

</head>

<body>
    <header>
        <h1 class="glow">🎓 Face Recognition Attendance System</h1>
        <h4 class="subglow">Smart • Secure • Automated Attendance</h4>
    </header>

    <h1 class="soon">Comming Soon...</h1>

</body>

<footer class="footer">
    <div class="footer-content">
        <div class="footer-left">
            <h3>🎓 Face Attendance System</h3>
            <p>AI-based Face Recognition Attendance Platform</p>
        </div>

        <div class="footer-center">
            <p>© 2026 Designed & Developed by Balaji P</p>
        </div>

        <div class="footer-right">
            <p class="tech">AI</p>
            <p class="tech">OpenCV</p>
            <p class="tech">Flask</p>
        </div>
    </div>
</footer>

</html>
